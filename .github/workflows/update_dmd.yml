name: Update NHS dm+d Dataset

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sunday at 3:00 AM UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  build-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download wardle/dmd Standalone JAR
        run: |
          curl -L -o dmd-server.jar https://github.com/wardle/dmd/releases/download/v0.6.139/dmd-server-0.6.139.jar

      - name: Build dm+d SQLite Database via Standalone JAR
        env:
          TRUD_API_KEY: ${{ secrets.TRUD_API_KEY }}
        run: |
          mkdir -p cache
          echo -n "$TRUD_API_KEY" > api-key.txt
          java -jar dmd-server.jar latest --api-key api-key.txt --cache-dir cache --db dmd.db

      - name: Run Export Script
        run: python export_dmd.py

      - name: Commit Updated JSON to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dmd_gtin_latest.json
          git commit -m "Automated update of NHS dm+d GTIN dataset" || exit 0
          git push
