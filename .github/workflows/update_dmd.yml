name: Update NHS dm+d Dataset

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sunday at 3:00 AM UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  build-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Clojure CLI & rlwrap
        run: |
          sudo apt-get update
          sudo apt-get install -y rlwrap
          curl -fsSLO https://download.clojure.org/install/linux-install-1.11.1.1413.sh
          chmod +x linux-install-1.11.1.1413.sh
          sudo ./linux-install-1.11.1.1413.sh

      - name: Clone wardle/dmd
        run: git clone --depth 1 https://github.com/wardle/dmd.git wardle-dmd

      - name: Build dm+d SQLite Database
        env:
          TRUD_API_KEY: ${{ secrets.TRUD_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/cache"
          printf '%s' "$TRUD_API_KEY" > "$GITHUB_WORKSPACE/api-key.txt"
          cd wardle-dmd
          clj -M:run latest \
            --api-key "$GITHUB_WORKSPACE/api-key.txt" \
            --cache-dir "$GITHUB_WORKSPACE/cache" \
            --db "$GITHUB_WORKSPACE/dmd.db"
          if [ ! -s "$GITHUB_WORKSPACE/dmd.db" ]; then
            echo "Error: dmd.db was not generated"
            exit 1
          fi

      - name: Run Export Script
        run: python export_dmd.py

      - name: Commit Updated JSON to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dmd_gtin_latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated update of NHS dm+d GTIN dataset"
          git push
